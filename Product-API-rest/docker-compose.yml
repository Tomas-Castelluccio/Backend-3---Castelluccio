services:
  app:
    image: tomascastelluccio/backend3:latest
    pull_policy: always
    ports:
      - "${PORT:-8080}:8080"
    env_file:
      - .env.example
    environment:
      PORT: 8080
      MONGO_URI: mongodb://mongo:27017/ecommerce
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-me-32chars}
    depends_on:
      mongo:
        condition: service_healthy
    volumes:
      - app-data:/app/data
    restart: unless-stopped

  mongo:
    image: mongo:7
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  app-data:
  mongo-data:
